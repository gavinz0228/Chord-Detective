<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b84b"/>
      <stop offset="52%" stop-color="#f06c5b"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="#1a1815" stroke="url(#g)" stroke-width="2.5"/>
  
  <!-- Double eighth note: stem 1 -->
  <line x1="24" y1="12" x2="24" y2="46" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <!-- Note head 1 -->
  <ellipse cx="17" cy="46" rx="8" ry="6" fill="url(#g)" transform="rotate(-15, 17, 46)"/>
  
  <!-- Stem 2 -->
  <line x1="44" y1="20" x2="44" y2="46" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <!-- Note head 2 -->
  <ellipse cx="37" cy="46" rx="8" ry="6" fill="url(#g)" transform="rotate(-15, 37, 46)"/>
  
  <!-- Beam connecting both -->
  <line x1="24" y1="12" x2="44" y2="20" stroke="#f2b84b" stroke-width="4" stroke-linecap="round"/>
</svg>
