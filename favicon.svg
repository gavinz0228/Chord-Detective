<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#g)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="30" fill="rgba(0,229,255,0.08)"/>
  <!-- Chord diagram: 3 vertical lines + 1 horizontal bar -->
  <line x1="16" y1="18" x2="16" y2="46" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="50" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="18" x2="48" y2="46" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal bar (capo/nut) -->
  <line x1="12" y1="14" x2="52" y2="14" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Finger dots -->
  <circle cx="16" cy="28" r="3.5" fill="#00e5ff"/>
  <circle cx="32" cy="36" r="3.5" fill="#a855f7"/>
  <circle cx="48" cy="28" r="3.5" fill="#00e5ff"/>
</svg>
