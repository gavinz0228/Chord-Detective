<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Raw Test v2</title>
<style>
body{margin:0;background:#000;color:#0f0;font:14px monospace;padding:20px}
canvas{display:block;width:100%;height:120px;background:#111;margin:10px 0}
button{padding:14px 28px;font-size:16px}
#info{margin:10px 0;white-space:pre-wrap}
</style>
</head>
<body>
<button id="btn">Start Mic</button>
<div id="info">Click button and grant mic permission</div>
<canvas id="c"></canvas>
<script>
const btn=document.getElementById('btn');
const info=document.getElementById('info');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let stream=null, audioCtx=null, analyser=null, frame=null, timer=null;
let sampleCount=0;

async function start(){
  try{
    audioCtx=new AudioContext();
    info.textContent='AudioContext: sampleRate='+audioCtx.sampleRate;
    
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    info.textContent+='\nStream: active';
    
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    info.textContent+='\nAnalyser: fftSize='+analyser.fftSize;
    
    // CRITICAL FIX: connect source to analyser, but do NOT connect analyser to destination
    // iOS Safari mutes the entire graph when gain=0 is downstream
    src.connect(analyser);
    // analyser is intentionally NOT connected to destination (prevents feedback naturally)
    
    frame=new Float32Array(analyser.fftSize);
    
    btn.textContent='Stop Mic';
    btn.onclick=stop;
    
    setTimeout(()=>{
      readFrame();
      timer=setInterval(readFrame, 100);
    }, 500);
    
  }catch(e){
    info.textContent+='\nERROR: '+e.message;
  }
}

function readFrame(){
  if(!analyser||!frame)return;
  analyser.getFloatTimeDomainData(frame);
  
  let sum=0, max=0, nonzero=0;
  for(let i=0;i<frame.length;i++){
    const v=Math.abs(frame[i]);
    sum+=v;
    if(v>max)max=v;
    if(v>0.00001)nonzero++;
  }
  const avg=sum/frame.length;
  sampleCount++;
  
  info.textContent='AudioContext: sampleRate='+audioCtx.sampleRate+
    '\nAnalyser: fftSize='+analyser.fftSize+
    '\nFrame #'+sampleCount+' | avgAbs='+avg.toFixed(6)+' | max='+max.toFixed(6)+' | nonzero='+nonzero+'/'+frame.length+
    '\n(NO gain node - direct connection)';
  
  drawWave();
}

function drawWave(){
  const w=canvas.width=canvas.clientWidth;
  const h=canvas.height=120;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#00ff00';
  ctx.lineWidth=1;
  ctx.beginPath();
  const step=Math.max(1,Math.floor(frame.length/w));
  for(let x=0;x<w;x++){
    let mx=0;
    for(let i=0;i<step;i++){
      const idx=x*step+i;
      if(idx<frame.length)mx=Math.max(mx,Math.abs(frame[idx]));
    }
    const y=h/2 - mx*h/2*0.9;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  
  ctx.strokeStyle='rgba(0,255,0,0.2)';
  ctx.beginPath();
  ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);
  ctx.stroke();
}

function stop(){
  if(timer)clearInterval(timer);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  stream=null;audioCtx=null;analyser=null;frame=null;timer=null;
  btn.textContent='Start Mic';
  btn.onclick=start;
  info.textContent='Stopped';
  ctx.clearRect(0,0,canvas.width,120);
}

btn.onclick=start;
</script>
</body>
</html>
