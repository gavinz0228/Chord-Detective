<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>ChordDetective / 和弦侦查员</title>
<style>
:root{--bg:#04060a;--glass:rgba(10,13,20,0.78);--bdr:rgba(255,255,255,0.07);--bdr-glow:rgba(0,229,255,0.25);
  --ink:#e6e9f2;--dim:#8892a8;--muted:#556078;--cyan:#00e5ff;--purple:#a855f7;--magenta:#ec4899;--green:#22d3a0;
  --r:16px;--rs:10px;
  --font:"SF Pro Display","Inter",ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Fira Code",ui-monospace,monospace;
  font-family:var(--font);font-size:16px;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 60% at 20% 10%,rgba(0,229,255,0.04) 0%,transparent 55%),
             radial-gradient(ellipse 80% 50% at 80% 20%,rgba(168,85,247,0.035) 0%,transparent 55%);
  animation:aurora 20s ease-in-out infinite alternate}
@keyframes aurora{0%{opacity:.7}100%{opacity:1}}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='52' viewBox='0 0 60 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 52 4.02 45V15z' fill='none' stroke='rgba(0,229,255,0.035)'/%3E%3C/svg%3E");
  background-size:60px 52px;opacity:.4}
button,input,select{font:inherit;color:inherit;outline:none}
select{-webkit-appearance:none;appearance:none}
.app{position:relative;z-index:1;width:min(1500px,calc(100vw - 40px));margin:0 auto;padding:36px 0 56px}

/* HERO */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:36px;flex-wrap:wrap}
.hero-left{flex:1;min-width:280px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;padding:6px 14px;border-radius:50px;
  background:rgba(0,229,255,0.07);border:1px solid rgba(0,229,255,0.15);
  color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.12em;font-family:var(--mono)}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
h1{font-size:clamp(40px,6.5vw,72px);line-height:.9;font-weight:900;letter-spacing:-.04em;margin-bottom:14px;
  background:linear-gradient(160deg,#fff 10%,var(--cyan) 45%,var(--purple) 85%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-logo{vertical-align:middle;margin-right:12px;filter:drop-shadow(0 0 12px rgba(0,229,255,0.4))}
.hero-sub{max-width:540px;color:var(--dim);font-size:15px;line-height:1.7}
.hero-status{flex-shrink:0;min-width:200px;padding:18px 24px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--cyan);text-align:center;font-weight:700;font-size:14px;font-family:var(--mono);
  box-shadow:0 16px 48px rgba(0,0,0,0.4);position:relative;overflow:hidden}
.hero-status::before{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 30%,rgba(0,229,255,0.05) 50%,transparent 70%);animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes skeleton{0%{background-position:-200% 0}100%{background-position:200% 0}}
.hero-status.analyzing{border-color:rgba(0,229,255,0.45);box-shadow:0 0 30px rgba(0,229,255,0.18),0 16px 48px rgba(0,0,0,0.4)}
.hero-status.analyzing::after{content:"";display:inline-block;width:10px;height:10px;border:2px solid rgba(0,229,255,0.25);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin-left:10px;vertical-align:middle}
.skeleton-row{display:grid;grid-template-columns:90px 80px 60px 1fr 70px;gap:16px;padding:14px 16px;border-bottom:1px solid var(--bdr);align-items:center}
.skeleton-row div{height:14px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,0.02) 25%,rgba(0,229,255,0.06) 50%,rgba(255,255,255,0.02) 75%);background-size:200% 100%;animation:skeleton 1.8s ease-in-out infinite}
.skeleton-row div:last-child{height:3px;border-radius:99px}

.glass{background:var(--glass);border:1px solid var(--bdr);border-radius:var(--r);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:22px;margin-bottom:18px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.card-num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:7px;
  font-size:14px;font-weight:800;font-family:var(--mono);
  background:linear-gradient(135deg,rgba(0,229,255,0.14),rgba(168,85,247,0.09));color:var(--cyan);margin-bottom:14px}
.card-label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;font-family:var(--mono)}

.card-main{margin-bottom:18px}
.nested-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.nested-card{background:rgba(255,255,255,0.015);border:1px solid var(--bdr);border-radius:var(--rs);padding:16px}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:10px;padding:4px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid var(--bdr)}
.tab{min-width:0;min-height:58px;padding:8px 10px;border-radius:6px;text-align:left;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border:1px solid transparent;background:transparent;text-decoration:none;transition:all .25s;display:flex;align-items:center;gap:9px}
.tab-icon{font-size:18px;line-height:1;flex:none}.tab-copy{min-width:0;display:grid;gap:3px}.tab-title{color:inherit;line-height:1.2}.tab-note{font-size:10px;font-weight:500;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--dim);background:rgba(255,255,255,0.025)}.tab.on{background:rgba(0,229,255,0.1);color:var(--cyan);border-color:rgba(0,229,255,0.2)}
.tab-demucs:hover{color:#d8b4fe;border-color:rgba(168,85,247,.22);background:rgba(168,85,247,.07)}.tab-demucs .tab-note{color:#c084fc}

.dropzone{min-height:110px;display:grid;place-items:center;padding:18px;border:1.5px dashed rgba(255,255,255,0.1);border-radius:var(--rs);cursor:pointer;text-align:center;transition:all .3s}
.dropzone:hover{border-color:rgba(0,229,255,0.3);background:rgba(0,229,255,0.02)}
.dropzone.drag{border-color:var(--cyan);border-style:solid;background:rgba(0,229,255,0.04);box-shadow:0 0 28px rgba(0,229,255,0.1)}
.dropzone strong{display:block;font-size:14px;margin-bottom:4px}.dropzone span{color:var(--muted);font-size:11px}
#fileInput{display:none}
.meta{padding:9px 11px;margin-top:10px;border-radius:var(--rs);background:rgba(255,255,255,0.02);border:1px solid var(--bdr);font-size:11px}
.meta strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.meta span{color:var(--muted)}
.saved-row{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:7px;margin-top:8px}
.saved-row select{min-width:0}.mini-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--bdr);background:rgba(255,255,255,0.03);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.mini-btn:hover:not(:disabled){color:#f87171;border-color:rgba(248,113,113,.3)}.mini-btn:disabled{opacity:.3;cursor:not-allowed}
.vocal-tools{display:flex;align-items:center;gap:12px;margin-top:8px;padding:9px 11px;border-radius:var(--rs);background:rgba(255,255,255,.02);border:1px solid var(--bdr);font-size:11px}
.vocal-toggle{display:inline-flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer}.vocal-toggle input{accent-color:var(--cyan)}.vocal-toggle input:disabled{cursor:not-allowed}

.mic-zone{display:none;text-align:center;padding:8px 0}.mic-zone.show{display:block}
.mic-btn{padding:15px 28px;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);background:rgba(255,255,255,0.03);color:var(--dim);transition:all .3s}
.mic-btn:hover{border-color:var(--bdr-glow);color:var(--cyan)}
.mic-btn.live{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.4);color:#f87171;animation:micPulse 1.5s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.mic-info{color:var(--muted);font-size:11px;margin-top:8px;font-family:var(--mono)}

.model-ok{display:flex;align-items:center;gap:7px;margin-top:10px}
.model-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.4s}
.model-dot.ready{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.5s ease-in-out infinite}

.btn{border:1px solid var(--bdr);border-radius:var(--rs);min-height:48px;padding:0 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer;transition:all .3s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(0.3)}.btn-full{width:100%}
.btn-model{background:rgba(255,255,255,0.03);color:var(--ink)}
.btn-model:hover:not(:disabled){border-color:rgba(0,229,255,0.3);color:var(--cyan)}
.btn-play{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(168,85,247,0.12));border-color:rgba(236,72,153,0.2);color:#fff;font-size:14px;padding:0 24px}

.progress{width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,0.05);overflow:hidden;margin-top:8px}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 8px rgba(0,229,255,0.3);transition:width .3s}
.progress-label{font-size:10px;color:var(--muted);margin-top:4px;text-align:center;font-family:var(--mono)}

.metrics{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;margin-bottom:18px;
  background:var(--glass);border:1px solid var(--bdr);border-radius:var(--r);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);gap:20px}
.met{text-align:center;flex:1}.met .l{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-family:var(--mono)}
.met .v{font-size:34px;font-weight:900;line-height:1;font-family:var(--mono);
  background:linear-gradient(160deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.met:first-child .v{font-size:44px}.met-div{width:1px;height:44px;background:var(--bdr);flex-shrink:0}
.met-note{max-width:220px;color:var(--muted);font-size:10px;line-height:1.5;flex-shrink:0}

.wave-panel,.results-panel{background:var(--glass);border:1px solid var(--bdr);border-radius:var(--r);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden;margin-bottom:18px}
.wave-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 8px}
.wave-hdr h2{font-size:16px;font-weight:700}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.live-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
.canvas-box{position:relative;margin:10px 0 0;background:linear-gradient(180deg,rgba(0,0,0,0.25),rgba(0,0,0,0.05));cursor:pointer}
canvas{display:block;width:100%;height:auto}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--magenta);box-shadow:0 0 20px rgba(236,72,153,0.6),0 0 3px rgba(236,72,153,1);pointer-events:none;z-index:2}
.time-chip{position:absolute;top:10px;transform:translateX(-50%);padding:3px 9px;border-radius:5px;background:rgba(10,13,20,0.9);border:1px solid rgba(255,255,255,0.07);color:var(--cyan);font-size:11px;font-weight:700;font-family:var(--mono);pointer-events:none;z-index:3;opacity:0;transition:opacity .12s}
.wave-leg{display:flex;gap:18px;padding:8px 20px 14px;font-size:10px;font-family:var(--mono);color:var(--dim)}
.wave-leg span{display:inline-flex;align-items:center;gap:6px}.ldot{width:7px;height:7px;border-radius:2px}
.wave-ctrls{padding:0 20px 6px}
tbody tr.playing-row{background:rgba(0,229,255,0.06);border-left-color:var(--magenta)}
tbody tr.paused-row{background:rgba(168,85,247,0.14);border-left-color:var(--purple);box-shadow:inset 0 0 24px rgba(168,85,247,0.06)}

.res-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px 0}
.res-hdr h2{font-size:16px;font-weight:700}.res-hdr .cnt{color:var(--muted);font-size:13px;font-family:var(--mono)}
.transpose-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:14px 20px 8px}
.tx-btn{padding:8px 0;border:1px solid var(--bdr);background:rgba(255,255,255,0.015);color:var(--dim);font-size:13px;font-family:var(--mono);cursor:pointer;transition:all .18s;flex:1;text-align:center;min-width:0}
.tx-btn:first-child{border-radius:6px 0 0 6px}.tx-btn:last-child{border-radius:0 6px 6px 0}
.tx-btn:hover{background:rgba(0,229,255,0.06);color:var(--cyan);border-color:rgba(0,229,255,0.25);z-index:1}
.tx-btn.on{background:linear-gradient(135deg,rgba(0,229,255,0.18),rgba(168,85,247,0.12));color:var(--cyan);border-color:rgba(0,229,255,0.4);font-weight:700;box-shadow:0 0 14px rgba(0,229,255,0.15),inset 0 0 8px rgba(0,229,255,0.06);z-index:2}
.tx-label{color:var(--dim);font-size:11px;font-family:var(--mono);margin:0 10px 0 4px;flex:none}
.tx-val{display:inline-block;min-width:28px;padding:4px 10px;border-radius:5px;background:rgba(0,229,255,0.1);color:var(--cyan);font-weight:900;font-size:18px;font-family:var(--mono);margin-left:8px;flex:none}
.conf-bar{display:flex;align-items:center;gap:14px;padding:16px 20px 14px;margin:4px 0 0;background:rgba(255,255,255,0.02);border-radius:var(--rs);border:1px solid rgba(255,255,255,0.04)}
.conf-label{color:var(--dim);font-size:13px;font-family:var(--mono);flex:none;white-space:nowrap;letter-spacing:.3px}
.conf-bar input[type=range]{flex:1;height:8px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,rgba(0,229,255,0.08),rgba(168,85,247,0.08));border-radius:4px;outline:none;cursor:pointer}
.conf-bar input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(0,229,255,0.15),var(--cyan));background-size:var(--slider-pct,0%) 100%;background-repeat:no-repeat}
.conf-bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,rgba(0,229,255,0.9),rgba(0,180,220,0.9));border:2px solid rgba(255,255,255,0.2);box-shadow:0 0 18px rgba(0,229,255,0.4),0 2px 8px rgba(0,0,0,0.5);cursor:pointer;margin-top:-7px}
.conf-bar input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(0,229,255,0.08),rgba(168,85,247,0.08))}
.conf-bar input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,rgba(0,229,255,0.9),rgba(0,180,220,0.9));border:2px solid rgba(255,255,255,0.2);box-shadow:0 0 18px rgba(0,229,255,0.4)}
.conf-bar input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 24px rgba(0,229,255,0.6),0 2px 8px rgba(0,0,0,0.5)}
.conf-val{color:var(--cyan);font-size:22px;font-weight:900;font-family:var(--mono);min-width:48px;text-align:right;text-shadow:0 0 12px rgba(0,229,255,0.3)}
.res-wrap{max-height:700px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 16px;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);
  position:sticky;top:0;background:rgba(10,13,20,0.95);backdrop-filter:blur(12px);z-index:1}
tbody tr{cursor:pointer;transition:all .18s;border-left:3px solid transparent}
tbody tr:hover{background:rgba(0,229,255,0.03);border-left-color:var(--cyan)}
.chord{display:inline-flex;min-width:64px;justify-content:center;padding:5px 10px;border-radius:5px;
  background:linear-gradient(135deg,rgba(0,229,255,0.1),rgba(168,85,247,0.08));border:1px solid rgba(0,229,255,0.16);color:var(--cyan);font-weight:800;font-size:15px;font-family:var(--mono)}
.notes{display:flex;flex-wrap:wrap;gap:4px}
.note{padding:3px 6px;border-radius:4px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.13);color:var(--purple);font-size:11px;font-weight:600;font-family:var(--mono)}
.note-extra{padding:3px 6px;border-radius:4px;background:rgba(255,140,50,0.06);border:1px dashed rgba(255,140,50,0.25);color:rgba(255,180,100,0.7);font-size:11px;font-weight:500;font-family:var(--mono)}
.note-miss{padding:3px 6px;border-radius:4px;background:transparent;border:1px dashed rgba(255,255,255,0.12);color:rgba(255,255,255,0.25);font-size:11px;font-weight:400;font-family:var(--mono)}
.cbar{width:80px;height:3px;border-radius:99px;background:rgba(255,255,255,0.05);overflow:hidden}
.cbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 6px rgba(0,229,255,0.25);transition:width .5s}
.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13px}

select{width:100%;padding:9px 11px;border-radius:var(--rs);background:rgba(255,255,255,0.03);border:1px solid var(--bdr);color:var(--ink);font-size:12px;cursor:pointer;font-family:var(--mono);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='%238892a8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:14px;padding-right:28px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.05);border-radius:99px}
@media(max-width:1000px){.hero{flex-direction:column}.metrics{flex-wrap:wrap}.met-div{display:none}.nested-row{grid-template-columns:1fr}}
@media(max-width:600px){.app{width:min(100vw - 20px,1500px)}.met .v{font-size:24px}.met:first-child .v{font-size:32px}.tabs{grid-template-columns:1fr}.tab{min-height:52px}.tab-copy{grid-template-columns:auto 1fr;align-items:baseline;column-gap:8px}.tab-note{text-align:right}}
.float-btn{position:fixed;bottom:24px;right:24px;z-index:100;width:68px;height:68px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,229,255,0.12),rgba(168,85,247,0.08));border:2px solid rgba(0,229,255,0.35);backdrop-filter:blur(24px);
  box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 28px rgba(0,229,255,0.15),inset 0 0 0 1px rgba(255,255,255,0.06);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;
  animation:floatPulse 2.5s ease-in-out infinite}
@keyframes floatPulse{0%,100%{box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 28px rgba(0,229,255,0.15),inset 0 0 0 1px rgba(255,255,255,0.06)}50%{box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 44px rgba(0,229,255,0.3),inset 0 0 0 1px rgba(255,255,255,0.1)}}

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>

<script>
const NS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],NF=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const BP_URL="https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json";
const SR=22050,AFPS=Math.floor(22050/256),MO=21;
const $=id=>document.getElementById(id);const ft=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");const cl=(v,l,h)=>Math.max(l,Math.min(h,v));
const zz=ms=>new Promise(r=>setTimeout(r,ms));

// STATE
const S={ctx:null,buf:null,origBuf:null,audioData:null,fn:"",fileSize:0,songId:"",vocalReduced:false,model:null,ml:false,res:[],playing:false,sa:0,pa:0,raf:null,src:null,playToken:0,activeSt:null,
  micStream:null,micSource:null,micAnalyser:null,micTimer:null,micListening:false,micStartedAt:0,micFrame:null,micCandidates:[],micStable:null,mode:"mic",transpose:0};

// ============ FFT (for mic mode) ============
function nearestPow2(v){return 2**Math.round(Math.log2(Math.max(2,v)))}
function fft(real,imag){const n=real.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[real[i],real[j]]=[real[j],real[i]];[imag[i],imag[j]]=[imag[j],imag[i]]}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wR=Math.cos(a),wI=Math.sin(a);
    for(let i=0;i<n;i+=len){let wr=1,wi=0;for(let j=0;j<len/2;j++){
      const uR=real[i+j],uI=imag[i+j],vR=real[i+j+len/2]*wr-imag[i+j+len/2]*wi,vI=real[i+j+len/2]*wi+imag[i+j+len/2]*wr;
      real[i+j]=uR+vR;imag[i+j]=uI+vI;real[i+j+len/2]=uR-vR;imag[i+j+len/2]=uI-vI;
      const nwR=wr*wR-wi*wI;wi=wr*wI+wi*wR;wr=nwR}}}}

function frameRms(fr){let s=0;for(const x of fr)s+=x*x;return Math.sqrt(s/fr.length)}

function chromaFromFrame(frame,sr){
  const n=nearestPow2(frame.length),real=new Float32Array(n),imag=new Float32Array(n);
  for(let i=0;i<n;i++){const w=.5*(1-Math.cos(2*Math.PI*i/(n-1)));real[i]=(frame[i]||0)*w}
  fft(real,imag);
  const c=new Float32Array(12),mnF=55,mxF=Math.min(5000,sr/2);
  const mnB=Math.max(1,Math.floor(mnF*n/sr)),mxB=Math.min(n/2-1,Math.ceil(mxF*n/sr));
  for(let b=mnB;b<=mxB;b++){const f=b*sr/n,midi=Math.round(69+12*Math.log2(f/440));if(midi<24||midi>108)continue;
    const pc=((midi%12)+12)%12,mag=Math.hypot(real[b],imag[b]);c[pc]+=Math.log1p(mag)/Math.sqrt(Math.max(1,f/220))}
  const mx=Math.max(...c);if(mx>0)for(let i=0;i<12;i++)c[i]/=mx;return c}

function detectBass(c){let i=0;for(let j=1;j<12;j++)if(c[j]>c[i])i=j;return i}

function topChromaNotes(c,ct){return[...c].map((v,pc)=>({pc,value:v})).sort((a,b)=>b.value-a.value).slice(0,ct).filter(i=>i.value>.18)}

// ============ CHORD TEMPLATES (mic chroma-style) ============
const CT_MIC=[{s:"",i:[0,4,7],w:[1,.9,.82]},{s:"m",i:[0,3,7],w:[1,.9,.82]},{s:"dim",i:[0,3,6],w:[1,.86,.7]},
  {s:"aug",i:[0,4,8],w:[1,.82,.72]},{s:"sus2",i:[0,2,7],w:[1,.72,.82]},{s:"sus4",i:[0,5,7],w:[1,.78,.82]},
  {s:"7",i:[0,4,7,10],w:[1,.82,.78,.52]},{s:"m7",i:[0,3,7,10],w:[1,.82,.78,.52]},{s:"maj7",i:[0,4,7,11],w:[1,.82,.78,.48]}];

function scoreChordTpl(c,root,tpl){let sc=0,ex=0;const mk=new Set(tpl.i.map(iv=>(root+iv)%12));
  tpl.i.forEach((iv,idx)=>{sc+=c[(root+iv)%12]*tpl.w[idx];ex+=tpl.w[idx]});
  let pn=0;for(let pc=0;pc<12;pc++)if(!mk.has(pc))pn+=c[pc]*.09;return sc/ex-pn}

function detectChordMic(c){
  let best={root:0,suffix:"",score:-Infinity,confidence:0};
  for(let r=0;r<12;r++)for(const tpl of CT_MIC){
    let sc=scoreChordTpl(c,r,tpl);
    // 7th gating: stricter to avoid false maj7/7 detections
    if(["7","m7","maj7"].includes(tpl.s)){const tr=CT_MIC.find(t=>t.s===(tpl.s==="m7"?"m":""));const ts=scoreChordTpl(c,r,tr);
      const ev=tpl.s==="maj7"?11:10,es=c[(r+ev)%12],trs=Math.min(c[r],c[(r+tr.i[1])%12],c[(r+7)%12]);
      if(!(es>.50&&es>trs*.68&&sc>ts+.01))sc-=.28}
    // sus gating
    if(["sus2","sus4"].includes(tpl.s)){const m3=Math.max(c[(r+4)%12],c[(r+3)%12]),sv=tpl.s==="sus2"?2:5,ss=c[(r+sv)%12];
      const mj=CT_MIC.find(t=>t.s===""),mn=CT_MIC.find(t=>t.s==="m"),bt=Math.max(scoreChordTpl(c,r,mj),scoreChordTpl(c,r,mn));
      if(!(m3<.34||ss>m3*1.45)||!(ss>.48&&sc>bt+.03))sc-=.2}
    // aug gating
    if(tpl.s==="aug"){const ae=Math.min(c[r],c[(r+4)%12],c[(r+8)%12]);if(!(ae>.32&&c[(r+8)%12]>c[(r+7)%12]*1.25))sc-=.24}
    if(sc>best.score)best={root:r,suffix:tpl.s,score:sc,confidence:cl(sc,0,1)}}
  return best}

// ============ MICROPHONE ============
async function toggleMic(){
  if(S.micListening){stopMic();return}
  try{
    S.ctx=S.ctx||new AudioContext();if(S.ctx.state==="suspended")await S.ctx.resume();
    S.micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    S.micSource=S.ctx.createMediaStreamSource(S.micStream);
    S.micAnalyser=S.ctx.createAnalyser();S.micAnalyser.fftSize=32768;S.micAnalyser.smoothingTimeConstant=0.18;
    const actualFft=S.micAnalyser.fftSize;
    // Connect source -> analyser only. Do NOT connect to destination.
    // iOS Safari kills the graph when gain=0 is downstream,
    // and not connecting avoids feedback naturally.
    S.micSource.connect(S.micAnalyser);
    S.micFrame=new Float32Array(actualFft);S.micStartedAt=performance.now();
    S.micListening=true;S.micCandidates=[];S.micStable=null;S.res=[];S.buf=null;
    resizeCanvas();
    $("fileInfo").innerHTML="<strong>麦克风监听中</strong><span>请弹奏清晰的和弦声音</span>";
    $("emptyState").textContent="等待麦克风和弦输入...";$("playBtn").disabled=true;
    $("keyGuess").textContent="—";renderRes();
    $("micBtn").textContent="⏹ 停止监听";$("micBtn").classList.add("live");
    $("status").textContent="◈ 正在监听";listenMicFrame();S.micTimer=setInterval(listenMicFrame,450)}

function listenMicFrame(){
  if(!S.micListening||!S.micAnalyser||!S.micFrame)return;
  S.micAnalyser.getFloatTimeDomainData(S.micFrame);
  const rms=frameRms(S.micFrame);
  if(rms<.0004){$("nowChord").textContent="—";$("nowNoteCount").textContent="—";$("status").textContent=rms<.0001?"◈ 等待声音":"◈ 输入偏低";$("micStatus").textContent=`FFT:${S.micAnalyser.fftSize} RMS:${rms.toFixed(6)}`;drawWaveform();return}
  const chroma=chromaFromFrame(S.micFrame,S.ctx.sampleRate);
  const chord=detectChordMic(chroma),bass=detectBass(chroma),tn=topChromaNotes(chroma,5);
  const now=(performance.now()-S.micStartedAt)/1000;
  const seg={start:Math.max(0,now-.45),end:now,chroma,chord,bass,topNotes:tn,pcs:tn.map(t=>t.pc)};
  const stable=updateMicStability(seg);if(stable)appendMicSegment(stable);
  $("nowChord").textContent=stable?cnMic(stable.chord):cnMic(chord);
  $("nowNoteCount").textContent=(stable?stable.pcs.length:tn.length)+" 个";$("status").textContent="◈ 正在监听";
  $("micStatus").textContent=`FFT:${S.micAnalyser.fftSize} RMS:${rms.toFixed(6)} SR:${S.ctx.sampleRate}`;
  renderRes();drawWaveform()}

function cnMic(c){const n=$("notationSelect").value==="flat"?NF:NS;return n[c.root]+c.suffix}

function updateMicStability(seg){

  const si=recent.filter(i=>i.key===winner).map(i=>i.seg),last=si[si.length-1];
  S.micStable={...last,start:si[0].start,end:last.end,chord:{...last.chord,confidence:si.reduce((s,i)=>s+i.chord.confidence,0)/si.length},pcs:last.pcs};return S.micStable}

function appendMicSegment(seg){
  const name=cnMic(seg.chord),prev=S.res[S.res.length-1];

  else{S.res.push(seg);if(S.res.length>80)S.res.shift()}}

const CT_FILE=[{n:"",i:[0,4,7]},{n:"m",i:[0,3,7]},{n:"dim",i:[0,3,6]},{n:"aug",i:[0,4,8]},{n:"sus2",i:[0,2,7]},{n:"sus4",i:[0,5,7]},{n:"7",i:[0,4,7,10]},{n:"m7",i:[0,3,7,10]},{n:"maj7",i:[0,4,7,11]},{n:"dim7",i:[0,3,6,9]},{n:"m7b5",i:[0,3,6,10]}];

function gm(a){return a.reduce((p,r)=>Math.max(p,...r),0)}
function msd(a){let s=0,q=0,n=0;for(const r of a)for(const v of r){s+=v;q+=v*v;n++}return[s/n,Math.sqrt((1/(n-1))*(q-(s*s)/n))]}
function wg(a,t){const x=[],y=[];for(let i=0;i<a.length;i++)for(let j=0;j<a[i].length;j++)if(a[i][j]>t){x.push(i);y.push(j)}return[x,y]}
function arm(a,o=1){const r=[];for(let c=0;c<a[0].length;c++)for(let ro=0;ro<a.length;ro++){let ok=true;for(let rr=Math.max(0,ro-o);ok&&rr<=Math.min(a.length-1,ro+o);rr++)if(rr!==ro)ok=ok&&a[ro][c]>a[rr][c];if(ok)r.push([ro,c])}return r}
function m3(a){const m=a[0].map(r=>[...r]);for(let x=1;x<a.length;x++)for(let y=0;y<m.length;y++)for(let z=0;z<m[0].length;z++)m[y][z]=Math.min(m[y][z],a[x][y][z]);return m}
function x3(a){const m=a[0].map(r=>[...r]);for(let x=1;x<a.length;x++)for(let y=0;y<m.length;y++)for(let z=0;z<m[0].length;z++)m[y][z]=Math.max(m[y][z],a[x][y][z]);return m}
function otnp(fr,on,ot=.5,ft=.3,mnl=5,io=true){const[mu,sd]=msd(fr);const ift=ft!==null?ft:mu+sd;let io2=on;
  if(io){const d=[1,2].map(n=>{const p=Array(n).fill(null).map(()=>Array(fr[0].length).fill(0)).concat(fr);return p.slice(n).map((r,i)=>r.map((v,c)=>v-p.slice(0,-n)[i][c]))});
    let fd=m3(d).map(r=>r.map(v=>Math.max(v,0)));fd=fd.map((r,i)=>i<2?r.fill(0):r);const om=gm(on),fdm=gm(fd)||1;fd=fd.map(r=>r.map(v=>(om*v)/fdm));io2=x3([on,fd])}
  const pm=io2.map(o=>o.map(()=>0));arm(io2).forEach(([r,c])=>{pm[r][c]=io2[r][c]});const[ns,fi]=wg(pm,ot);ns.reverse();fi.reverse();
  const re=fr.map(f=>[...f]);const ne=[];ns.forEach(s=>{const fc=fi.shift();if(s>=fr.length-1)return;let i=s+1,k=0;while(i<fr.length-1&&k<11){if(re[i][fc]<ift)k++;else k=0;i++}i-=k;if(i-s<=mnl)return;
    for(let j=s;j<i;j++){re[j][fc]=0;if(fc<87)re[j][fc+1]=0;if(fc>0)re[j][fc-1]=0}ne.push({sf:s,df:i-s,pm:fc+MO,amp:fr.slice(s,i).reduce((a,r)=>a+r[fc],0)/(i-s)})});
  while(gm(re)>ift){let br=0,bc=0,bv=0;for(let r=0;r<re.length;r++)for(let c=0;c<re[r].length;c++)if(re[r][c]>bv){bv=re[r][c];br=r;bc=c}re[br][bc]=0;
    let i=br+1,k=0;while(i<fr.length-1&&k<11){if(re[i][bc]<ift)k++;else k=0;re[i][bc]=0;if(bc<87)re[i][bc+1]=0;if(bc>0)re[i][bc-1]=0;i++}const ie=i-1-k;i=br-1;k=0;
    while(i>0&&k<11){if(re[i][bc]<ift)k++;else k=0;re[i][bc]=0;if(bc<87)re[i][bc+1]=0;if(bc>0)re[i][bc-1]=0;i--}const is=i+1+k;if(is<0||ie>=fr.length||ie-is<=mnl)continue;
    ne.push({sf:is,df:ie-is,pm:bc+MO,amp:fr.slice(is,ie).reduce((a,r)=>a+r[bc],0)/(ie-is)})}return ne}
function mft(f){const WO=(256/SR)*(172-(SR*2-256)/256)+.0018;return(f*256)/SR-WO*Math.floor(f/172)}
function ntt(n){return n.map(n=>{const s=mft(n.sf);return{...n,st:s,dur:mft(n.sf+n.df)-s}})}
function dcpc(pcs){if(pcs.size===0)return{root:0,suffix:"",confidence:0};let b={root:0,suffix:"",confidence:-Infinity};
  for(let r=0;r<12;r++)for(const t of CT_FILE){const tp=new Set(t.i.map(iv=>(r+iv)%12));let m=0,e=0;for(const pc of pcs)tp.has(pc)?m++:e++;

async function analyzeFile(){

  const src=oc.createBufferSource();const b=oc.createBuffer(1,mono.length,S.buf.sampleRate);b.getChannelData(0).set(mono);src.buffer=b;src.connect(oc.destination);src.start();

function mergeRes(cs){const mg=[];for(const c of cs){const p=mg[mg.length-1];if(p&&cn(p.chord)===cn(c.chord)){p.en=c.en;p._c=(p._c||[p.chord.confidence]).concat(c.chord.confidence)}else mg.push({...c,_c:[c.chord.confidence]})}

    trEl.addEventListener("click",()=>{if(S.buf)seekTo(st)});tb.appendChild(trEl)}

function drawWaveform(){
  const c=$("waveCanvas"),ctx=c.getContext("2d"),w=c.width,h=c.height;if(!w||!h)return;ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(242,184,75,0.035)";ctx.lineWidth=.35;for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}

  // Mic mode: draw live waveform from mic time-domain frame
  if(S.mode==="mic"&&S.micFrame){
    const data=S.micFrame,len=data.length,step=Math.max(1,Math.floor(len/w));
    ctx.lineWidth=1.3;ctx.shadowColor="#f2b84b";ctx.shadowBlur=6;
    ctx.beginPath();ctx.strokeStyle="rgba(242,184,75,0.68)";
    for(let x=0;x<w;x++){let mx=0;const st=x*step;for(let i=0;i<step&&st+i<len;i++)mx=Math.max(mx,Math.abs(data[st+i]));const y=h/2-mx*h/2*.9;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0;
    ctx.beginPath();ctx.strokeStyle="rgba(255,255,255,0.03)";ctx.lineWidth=.5;ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    // Draw chord segments from mic results

      const totalDu=(S.res[S.res.length-1].en-S.res[0].st)+.5;
      for(const r of S.res){const x1=((r.st-S.res[0].st)/totalDu)*w,x2=((r.en-S.res[0].st)/totalDu)*w;ctx.fillStyle="rgba(167,139,250,0.07)";ctx.fillRect(x1,0,Math.max(x2-x1,1),h)}
    }

  }

  const mono=S.buf?mixMono(S.buf):null;if(!mono)return;const du=mono.length/S.buf.sampleRate;
  const thresh=parseInt($("confRange").value)/100;
  const visible=S.res.filter(r=>(r.chord.confidence||.7)>=thresh);

  const step=Math.max(1,Math.floor(mono.length/w));ctx.lineWidth=1.3;ctx.shadowColor="#f2b84b";ctx.shadowBlur=6;
  ctx.beginPath();ctx.strokeStyle="rgba(242,184,75,0.68)";for(let x=0;x<w;x++){let mx=0;const st=x*step;for(let i=0;i<step&&st+i<mono.length;i++)mx=Math.max(mx,mono[st+i]);const y=h/2-mx*h/2*.8;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.strokeStyle="rgba(255,255,255,0.03)";ctx.lineWidth=.5;ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke()}

function setPlayUi(playing){$("playIcon").innerHTML=playing?'<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>':'<path d="M8 5v14l11-7z"></path>';$("playLabel").textContent=playing?"暂停":"播放音频";

// ============ EVENTS ============
const DB_NAME="chord-detective",DB_STORE="songs";
function openSongDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE,{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function songStore(mode,work){const db=await openSongDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,mode),store=tx.objectStore(DB_STORE);work(store,resolve,reject);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
function getSavedSongs(){return songStore("readonly",(store,resolve,reject)=>{const req=store.getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getSavedSong(id){return songStore("readonly",(store,resolve,reject)=>{const req=store.get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function putSavedSong(song){return songStore("readwrite",(store,resolve,reject)=>{const req=store.put(song);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)})}
function removeSavedSong(id){return songStore("readwrite",(store,resolve,reject)=>{const req=store.delete(id);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)})}
async function refreshSavedSongs(selected=S.songId){try{const songs=(await getSavedSongs()).sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0)),select=$("savedSongs");select.innerHTML='<option value="">本地歌曲历史</option>';for(const song of songs){const opt=document.createElement("option");opt.value=song.id;opt.textContent=song.name;select.appendChild(opt)}select.value=selected||"";$("deleteSaved").disabled=!select.value}catch(e){console.warn("Saved-song history unavailable",e)}}
async function persistSong(){if(!S.songId||!S.audioData)return;try{await putSavedSong({id:S.songId,name:S.fn,size:S.fileSize,lastOpened:Date.now(),audioData:S.audioData.slice(0),results:S.res,vocalReduced:S.vocalReduced});await refreshSavedSongs(S.songId)}catch(e){console.warn("Could not save song",e)}}
function setFileInfo(){const box=$("fileInfo");box.innerHTML="";const name=document.createElement("strong"),meta=document.createElement("span");name.textContent=S.fn;meta.textContent=`${S.buf.duration.toFixed(1)}s · ${S.buf.sampleRate}Hz · ${S.buf.numberOfChannels}ch`;box.append(name,meta)}
function makeVocalReducedBuffer(source){if(source.numberOfChannels<2)return source;const ctx=S.ctx||new AudioContext(),out=ctx.createBuffer(2,source.length,source.sampleRate),left=source.getChannelData(0),right=source.getChannelData(1),outL=out.getChannelData(0),outR=out.getChannelData(1);for(let i=0;i<source.length;i++){const side=(left[i]-right[i])*.72;outL[i]=side;outR[i]=side}return out}
async function loadSongRecord(song,save=true){if(!song||!song.audioData)return;stopPlay(true);stopMic();S.mode="file";S.fn=song.name;S.fileSize=song.size||song.audioData.byteLength;S.songId=song.id;S.audioData=song.audioData.slice(0);S.vocalReduced=!!song.vocalReduced;S.res=Array.isArray(song.results)?song.results:[];
  const actx=new AudioContext();S.origBuf=await actx.decodeAudioData(song.audioData.slice(0));await actx.close();S.buf=S.vocalReduced?makeVocalReducedBuffer(S.origBuf):S.origBuf;
  $("vocalReduce").disabled=S.origBuf.numberOfChannels<2;$("vocalReduce").checked=S.vocalReduced;$("playBtn").disabled=false;$("floatBtn").style.display="flex";setFileInfo();resizeCanvas();renderRes();drawWaveform();$("status").textContent=S.res.length?"◈ 已恢复分析结果":"◈ 音频就绪";if(save)persistSong();if(!S.res.length&&S.ml){$("status").textContent="◈ 自动检测中...";analyzeFile()}setTimeout(resizeCanvas,100)}
async function handleFile(file){const ab=await file.arrayBuffer(),id=`${file.name}:${file.size}:${file.lastModified}`;await loadSongRecord({id,name:file.name,size:file.size,lastOpened:Date.now(),audioData:ab,results:[],vocalReduced:false},true)}
async function setVocalReduction(enabled){if(!S.origBuf)return;stopPlay(true);S.vocalReduced=enabled;S.buf=enabled?makeVocalReducedBuffer(S.origBuf):S.origBuf;S.res=[];S.activeSt=null;renderRes();resizeCanvas();$("status").textContent=enabled?"◈ 已降低中置人声，重新检测中...":"◈ 原始音频，重新检测中...";await persistSong();if(S.ml)analyzeFile()}
async function loadModel(){const btn=$("loadModelBtn"),pb=$("modelBar"),pt=$("modelText");btn.disabled=true;pb.style.display="block";pt.textContent="加载中...";pb.querySelector("div").style.width="30%";
  try{S.model=await tf.loadGraphModel(BP_URL);pb.querySelector("div").style.width="100%";pt.textContent="✓ 就绪";S.ml=true;$("status").textContent="◈ 模型就绪";$("modelBadge").style.display="flex";$("modelDot").classList.add("ready");if(S.buf&&!S.res.length){$("playBtn").disabled=false;$("floatBtn").style.display="flex";$("status").textContent="◈ 自动检测中...";analyzeFile()}}catch(e){pt.textContent="失败: "+e.message;$("status").textContent="◈ 加载失败";btn.disabled=false}}

function showInputMode(mode,updateUrl=true){const tab=$("inputTabs").querySelector(`[data-mode="${mode}"]`);if(!tab||mode==="demucs")return;
  $("inputTabs").querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));tab.classList.add("on");S.mode=mode;
  if(updateUrl){const url=new URL(location.href);if(mode==="file")url.searchParams.set("mode","file");else url.searchParams.delete("mode");history.replaceState(null,"",url)}
  if(S.mode==="file"){$("fileSection").style.display="block";$("micSection").classList.remove("show");$("fileCards").style.display="";stopMic();if(S.buf)$("floatBtn").style.display="flex";resizeCanvas()}
  else{$("fileSection").style.display="none";$("micSection").classList.add("show");$("fileCards").style.display="none";S.buf=null;S.res=[];renderRes();$("floatBtn").style.display="none";resizeCanvas()}}
$("inputTabs").addEventListener("click",e=>{const tab=e.target.closest(".tab");if(!tab)return;if(tab.dataset.mode==="demucs"){stopMic();return}showInputMode(tab.dataset.mode)});
$("fileInput").addEventListener("change",e=>{if(e.target.files[0])handleFile(e.target.files[0])});
const dz=$("dropZone");dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag")});dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
$("loadModelBtn").addEventListener("click",loadModel);
$("playBtn").addEventListener("click",()=>{if(S.playing)stopPlay();else playAt(S.pa||0)});$("micBtn").addEventListener("click",toggleMic);
$("floatBtn").addEventListener("click",()=>{if(S.playing)stopPlay();else playAt(S.pa||0)});
$("savedSongs").addEventListener("change",async e=>{const id=e.target.value;$("deleteSaved").disabled=!id;if(!id)return;const song=await getSavedSong(id);if(song)loadSongRecord(song,true)});
$("deleteSaved").addEventListener("click",async()=>{const id=$("savedSongs").value;if(!id)return;await removeSavedSong(id);if(S.songId===id)S.songId="";await refreshSavedSongs()});
$("vocalReduce").addEventListener("change",e=>setVocalReduction(e.target.checked));
$("notationSelect").addEventListener("change",renderRes);
$("confRange").addEventListener("input",()=>{const pct=$("confRange").value;$("confVal").textContent=pct+"%";$("confRange").style.setProperty("--slider-pct",pct+"%");renderRes();drawWaveform()});
$("transposeBar").addEventListener("click",e=>{const btn=e.target.closest(".tx-btn");if(!btn)return;S.transpose=parseInt(btn.dataset.d);$("transposeBar").querySelectorAll(".tx-btn").forEach(b=>b.classList.toggle("on",b===btn));$("txVal").textContent=S.transpose===0?"±0":(S.transpose>0?"+"+S.transpose:S.transpose);renderRes();drawWaveform()});
$("waveCanvas").addEventListener("click",e=>{if(!S.buf)return;const r=e.target.getBoundingClientRect();playAt((e.clientX-r.left)/r.width*S.buf.duration)});
window.addEventListener("resize",()=>{if(S.buf||S.micListening)resizeCanvas()});window.addEventListener("DOMContentLoaded",()=>{const requestedMode=new URLSearchParams(location.search).get("mode");if(requestedMode==="file"||requestedMode==="mic")showInputMode(requestedMode,false);resizeCanvas();refreshSavedSongs();setTimeout(loadModel,400)});
</script>
</body>
</html>
